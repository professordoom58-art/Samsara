<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>SAMSARA</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="status-bar" aria-label="System status">
      <div class="status-network" aria-label="4G signal">
        <span class="signal-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>4G</span>
      </div>
      <div class="status-clock">
        <span id="status-time">--:--</span>
        <span class="battery-icon" aria-label="Battery">
          <span class="battery-level"></span>
        </span>
        <button type="button" id="presentation-toggle" class="presentation-toggle" aria-label="Toggle presentation board" title="Toggle presentation board (Tab)">&#x25EB;</button>
      </div>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
    <footer class="softkey-bar" aria-label="Soft keys">
      <button type="button" id="softkey-left" class="softkey" data-action="soft-left">Options</button>
      <span class="dpad-indicator" aria-hidden="true"><i></i></span>
      <button type="button" id="softkey-right" class="softkey" data-action="soft-right">Back</button>
    </footer>
  </div>
  <input id="music-file-picker" class="visually-hidden" type="file" accept="audio/mpeg,audio/flac,audio/wav,audio/ogg,audio/mp4,audio/aac,.mp3,.flac,.wav,.ogg,.m4a,.aac" multiple webkitdirectory>
  <audio id="audio" preload="metadata"></audio>
  <script src="js/storage.js"></script>
  <script src="js/metadata.js"></script>
  <script src="js/library.js"></script>
  <script src="js/player.js"></script>
  <script src="js/music-store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
