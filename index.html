<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101317">
  <title>SAMSARA</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <main id="screen" class="screen" aria-live="polite"></main>
    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-screen="library" class="nav-button active">Library</button>
      <button type="button" data-screen="playlists" class="nav-button">Lists</button>
      <button type="button" data-screen="now-playing" class="nav-button">Playing</button>
      <button type="button" data-screen="settings" class="nav-button">More</button>
    </nav>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script src="js/storage.js"></script>
  <script src="js/metadata.js"></script>
  <script src="js/library.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
